<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Pin Docs Tree</title>
<meta name="description" content="Every note of the Social Pin docs vault as a readable tree: project → modules → features → one note per layer (story, frontend requirements, backend delivery and integration, frontend delivery, QA), tasks and decisions. Relations, the hand-off flow and blockers appear behind the tree and light up on hover.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5f6b7d; --line: #d9dee6; --line-strong: #aeb7c4;
  --accent: #2f7de1; --accent-ink: #ffffff; --hover: #eef3fb; --selected: #dfeafb; --shadow: 0 1px 2px rgba(16,24,40,.08), 0 8px 24px rgba(16,24,40,.08);
  --s-done: #2f9e63; --s-partial: #d99a1a; --s-todo: #8a94a6; --s-in-progress: #2f7de1; --s-blocked: #d9534f;
  --s-needs-decision: #8e5bd6; --s-draft: #3fa7a3; --s-approved: #2f9e63; --s-verified: #1f7a5c; --s-delivered: #2f9e63; --s-current: #2f9e63; --s-passing: #2f9e63; --s-failing: #d9534f; --s-frontend-only: #9aa3b2; --s-missing: #b0b6c0; --s-reference: #6b7a90;
  --e-tree: #7f8a9b; --e-related: #2f7de1; --e-wikilink: #8a94a6; --e-depends: #d9534f; --e-decision: #8e5bd6; --e-affects: #e07b22; --e-blocks: #c9302c; --e-flow: #1f9e8a; --e-shares: #6f9ad1;
  --font: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1419; --panel: #161c24; --ink: #e6ebf2; --muted: #9aa6b8; --line: #27303c; --line-strong: #3b4654;
  --hover: #1d2631; --selected: #1f3350; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  --s-todo: #7c8797; --s-missing: #5c6572; --e-tree: #93a0b3; --e-wikilink: #6b7686;
} }
:root[data-theme="dark"] {
  --bg: #0f1419; --panel: #161c24; --ink: #e6ebf2; --muted: #9aa6b8; --line: #27303c; --line-strong: #3b4654;
  --hover: #1d2631; --selected: #1f3350; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  --s-todo: #7c8797; --s-missing: #5c6572; --e-tree: #93a0b3; --e-wikilink: #6b7686;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); font-feature-settings: "cv11", "ss01"; display: flex; flex-direction: column; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; }
header h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
header h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.btn:hover { background: var(--hover); }
#search { flex: 1 1 180px; min-width: 140px; max-width: 360px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); }
select { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips.layers { border-left: 1px solid var(--line); padding-left: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 8px; font-size: 12px; cursor: pointer; background: var(--panel); user-select: none; white-space: nowrap; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); display: inline-block; }
.chip[aria-pressed="true"] { background: var(--c); color: #fff; border-color: var(--c); }
.chip[aria-pressed="true"] i { background: #fff; }
.count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.seg .lbl { padding: 5px 8px 5px 10px; color: var(--muted); font-size: 12px; align-self: center; }
.menu { position: relative; }
.menu-list { position: absolute; top: calc(100% + 4px); right: 0; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 6; }
.menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu-list button:hover { background: var(--hover); }
.menu-note { color: var(--muted); font-size: 11px; padding: 4px 10px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu-msg { color: var(--s-blocked); font-size: 11px; padding: 4px 10px; }
.menu-msg:empty { display: none; }
main { flex: 1; display: grid; grid-template-columns: 1fr minmax(0, 0px); min-height: 0; position: relative; }
main.pane-open { grid-template-columns: 1fr minmax(360px, 44%); }
#map, #outline { position: relative; min-height: 0; overflow: hidden; }
#outline { overflow: auto; padding: 12px 16px 60px; }
svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
svg.dragging { cursor: grabbing; }
.map-tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 2; }
.map-tools .btn { padding: 4px 9px; }
.legend { position: absolute; right: 12px; bottom: 12px; max-width: min(380px, calc(100% - 180px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); z-index: 2; }
.legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 2px 0; }
.legend .ln { width: 22px; height: 0; border-top: 2px solid var(--c); display: inline-block; }
.legend .ln.thin { border-top-width: 1.5px; border-top-style: dashed; }
/* svg nodes */
.n { cursor: grab; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
svg.drag-live .n { transition: none; }
.n.dragging { cursor: grabbing; }
.n.focus rect.box { stroke: var(--accent); stroke-width: 3; }
.n.focus text.name { font-weight: 700; }
#focus-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--selected); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 6px 2px 10px; font-size: 12px; }
#focus-chip button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; width: 18px; height: 18px; line-height: 18px; font-size: 11px; cursor: pointer; padding: 0; }
.n.dragging rect.box { stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 6px 10px rgba(16,24,40,.25)); }
.n rect.box { fill: var(--panel); stroke: var(--line-strong); stroke-width: 1; rx: 9; }
.n.sel rect.box { stroke: var(--accent); stroke-width: 2; }
.n:hover rect.box, .n.hov rect.box { stroke: var(--accent); stroke-width: 2.5; }
.n.far rect.box { stroke: var(--accent); stroke-width: 2; }
.n text { font: 13px var(--font); fill: var(--ink); dominant-baseline: middle; pointer-events: none; }
.n text.glyph { font-size: 13px; }
.n text.lbl { font-size: 10px; fill: var(--muted); }
.n rect.status { rx: 6; }
.n text.st { font-size: 10px; fill: #fff; font-weight: 600; }
.n.k-root text.name, .n.k-module text.name { font-weight: 700; }
.n.k-module rect.box, .n.k-root rect.box, .n.k-group rect.box { stroke-width: 1.5; }
.n rect.layer { rx: 1.5; opacity: .9; }
.n.missing rect.box { stroke-dasharray: 4 3; }
.n.missing text.name { fill: var(--muted); }
.n.faded { opacity: .22; }
.n .caret { fill: var(--panel); stroke: var(--line-strong); cursor: pointer; }
.n .caret-t { font-size: 10px; fill: var(--muted); pointer-events: none; }
.n .stripe { rx: 9; }
#tree-edges path { fill: none; stroke: var(--e-tree); stroke-width: 2.2; opacity: .9; }
#tree-edges path.faded { opacity: .15; }
#rel-edges path { fill: none; stroke-width: 1.4; opacity: .16; transition: opacity .15s; }
#rel-edges path.k-wikilink { opacity: .09; }
#rel-edges path.k-related { stroke: var(--e-related); }
#rel-edges path.k-wikilink { stroke: var(--e-wikilink); }
#rel-edges path.k-depends { stroke: var(--e-depends); }
#rel-edges path.k-decision { stroke: var(--e-decision); }
#rel-edges path.k-affects { stroke: var(--e-affects); marker-end: url(#arr); }
#rel-edges path.k-depends { marker-end: url(#arr); }
#rel-edges path.k-blocks { stroke: var(--e-blocks); marker-end: url(#arr); stroke-width: 1.8; }
#rel-edges path.k-flow { stroke: var(--e-flow); stroke-dasharray: 6 4; marker-end: url(#arr); }
#rel-edges path.k-shares { stroke: var(--e-shares); opacity: .1; }
#rel-edges path.k-decision { marker-end: url(#arr); }
#arr path { fill: context-stroke; }
#rel-edges path.routed { stroke-dasharray: 5 4; }
svg.hovering #rel-edges path { opacity: .04; }
svg.hovering #rel-edges path.lit { opacity: 1; stroke-width: 2.2; }
svg.hovering #tree-edges path { opacity: .35; }
svg.hovering .n:not(.lit):not(.far):not(.hov) { opacity: .35; }
#rel-edges text { font: 10px var(--font); fill: var(--muted); display: none; }
#rel-edges g.lit text { display: block; }
/* outline */
ul[role="tree"], ul[role="group"] { list-style: none; margin: 0; padding: 0; }
ul[role="group"] { margin-left: 22px; border-left: 1px solid var(--line); }
li[role="treeitem"] > .row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
li[role="treeitem"] > .row:hover { background: var(--hover); }
li[role="treeitem"] > .row.sel { background: var(--selected); }
li[role="treeitem"] > .row:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.row .car { width: 16px; color: var(--muted); font-size: 11px; text-align: center; }
.row .g { width: 18px; text-align: center; }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.faded { opacity: .35; }
.st-chip { font-size: 10px; font-weight: 600; color: #fff; padding: 1px 6px; border-radius: 6px; background: var(--c, var(--muted)); white-space: nowrap; }
.rel-chip { font-size: 10px; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; border-radius: 6px; }
/* pane */
#pane { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; min-height: 0; display: none; }
main.pane-open #pane { display: block; }
#pane .ph { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; z-index: 1; }
#pane .ph h2 { font-size: 16px; margin: 0; flex: 1 1 100%; }
#pane .ph .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
#pane .ph .x { margin-left: auto; }
#pane .body { padding: 12px 16px 48px; }
.fm { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 12px; margin: 0 0 14px; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
.fm dt { color: var(--muted); }
.fm dd { margin: 0; font-family: var(--mono); word-break: break-word; }
.rels { margin: 0 0 14px; font-size: 12px; }
.rels h3 { font-size: 12px; margin: 10px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.rels a { display: inline-block; margin: 2px 6px 2px 0; }
.rels .k { color: var(--muted); font-size: 11px; }
article { line-height: 1.55; }
article h1 { font-size: 20px; margin: 4px 0 12px; }
article h2 { font-size: 16px; margin: 22px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
article h3 { font-size: 14px; margin: 16px 0 6px; }
article h4 { font-size: 13px; margin: 12px 0 4px; }
article p { margin: 0 0 10px; }
article ul, article ol { padding-left: 22px; margin: 0 0 10px; }
article li { margin: 2px 0; }
article li.task { list-style: none; margin-left: -18px; }
article code { font: 12px var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 4px; }
article pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow: auto; font: 12px/1.45 var(--mono); }
article pre code { background: transparent; padding: 0; }
article table { border-collapse: collapse; width: 100%; margin: 0 0 12px; font-size: 13px; display: block; overflow-x: auto; }
article th, article td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
article th { background: var(--bg); }
article blockquote { margin: 0 0 10px; padding: 6px 12px; border-left: 3px solid var(--line-strong); color: var(--muted); }
article img { max-width: 100%; border-radius: 6px; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
article .obsidian-only { background: var(--bg); border: 1px dashed var(--line-strong); color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 12px; margin: 0 0 10px; }
article a.ext { text-decoration-style: dotted; }
article a.missing { color: var(--muted); text-decoration: line-through; }
.empty { color: var(--muted); padding: 20px; }
kbd { font: 11px var(--mono); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
@media (max-width: 719px) {
  main.pane-open { grid-template-columns: 1fr; }
  main.pane-open #pane { position: absolute; inset: 0; z-index: 4; border-left: 0; }
  .legend { display: none; }
  header h1 small { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Social Pin <small>docs tree</small></h1>
  <div class="seg" role="group" aria-label="View">
    <button id="v-map" aria-pressed="true">Map</button>
    <button id="v-outline" aria-pressed="false">Outline</button>
  </div>
  <input id="search" type="search" placeholder="Search notes, ids, screens…  ( / )" aria-label="Search">
  <select id="f-module" aria-label="Module"><option value="">All modules</option></select>
  <select id="f-kind" aria-label="Kind"><option value="">All kinds</option></select>
  <div class="chips layers" id="f-layer" aria-label="Layer filter"></div>
  <div class="chips" id="f-status" aria-label="Status filter and legend"></div>
  <button class="btn" id="expand">Expand all</button>
  <button class="btn" id="collapse">Collapse all</button>
  <div class="seg" role="group" aria-label="Map direction">
    <span class="lbl">Direction</span>
    <button id="o-vertical" aria-pressed="true" title="Root at the top, levels as rows">⇅ Vertical</button>
    <button id="o-horizontal" aria-pressed="false" title="Root at the left, levels as columns">⇄ Horizontal</button>
  </div>
  <div class="menu" id="layout-menu">
    <button class="btn" id="layout-btn" aria-haspopup="true" aria-expanded="false" title="Hand-made card positions: reset, export, import">Layout ▾</button>
    <div class="menu-list" id="layout-list" hidden>
      <div class="menu-note" id="layout-moved">No cards moved</div>
      <button id="layout-reset">Reset positions (this direction)</button>
      <button id="layout-export">Export layout…</button>
      <button id="layout-import">Import layout…</button>
      <div class="menu-msg" id="layout-msg"></div>
      <input type="file" id="layout-file" accept=".json,application/json" hidden>
    </div>
  </div>
  <button class="btn" id="theme" title="Switch light / dark">Theme</button>
  <span id="focus-chip" hidden><span id="focus-name"></span><button id="focus-clear" title="End focus (Esc)">✕</button></span>
  <span class="count" id="count"></span>
</header>
<main id="main">
  <section id="map">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Docs tree map">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs>
      <g id="viewport"><g id="rel-edges"></g><g id="tree-edges"></g><g id="nodes"></g></g>
    </svg>
    <div class="map-tools">
      <button class="btn" id="z-in" title="Zoom in">+</button>
      <button class="btn" id="z-out" title="Zoom out">−</button>
      <button class="btn" id="z-fit" title="Fit">Fit</button>
    </div>
    <div class="legend" id="legend">
      <label><span class="ln" style="--c: var(--e-tree)"></span> Tree (bold)</label>
      <label><input type="checkbox" data-kind="flow" checked><span class="ln thin" style="--c: var(--e-flow)"></span> Flow (hand-off order) →</label>
      <label><input type="checkbox" data-kind="blocks" checked><span class="ln thin" style="--c: var(--e-blocks)"></span> Blocks →</label>
      <label><input type="checkbox" data-kind="affects" checked><span class="ln thin" style="--c: var(--e-affects)"></span> Affects →</label>
      <label><input type="checkbox" data-kind="depends" checked><span class="ln thin" style="--c: var(--e-depends)"></span> Depends on →</label>
      <label><input type="checkbox" data-kind="related" checked><span class="ln thin" style="--c: var(--e-related)"></span> Related</label>
      <label><input type="checkbox" data-kind="shares" checked><span class="ln thin" style="--c: var(--e-shares)"></span> Shares an endpoint / code</label>
      <label><input type="checkbox" data-kind="decision" checked><span class="ln thin" style="--c: var(--e-decision)"></span> Decision affects →</label>
      <label><input type="checkbox" data-kind="wikilink" checked><span class="ln thin" style="--c: var(--e-wikilink)"></span> Mentions (wikilink)</label>
    </div>
  </section>
  <section id="outline" hidden><ul role="tree" id="otree"></ul></section>
  <aside id="pane" aria-live="polite">
    <div class="ph">
      <h2 id="p-title"></h2>
      <div class="meta" id="p-meta"></div>
      <a class="btn" id="p-gh" target="_blank" rel="noopener">Open on GitHub</a>
      <button class="btn x" id="p-close" aria-label="Close">✕</button>
    </div>
    <div class="body">
      <dl class="fm" id="p-fm"></dl>
      <div class="rels" id="p-rels"></div>
      <article id="p-article"></article>
    </div>
  </aside>
</main>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const GLYPH = { root: '◉', module: '🗂', group: '📘', feature: '◆', story: '💬', 'frontend-requirements': '📋', 'backend-delivery': '🛠', 'backend-integration': '🔌', 'frontend-delivery': '📱', 'qa-backend': '🧪', 'qa-frontend': '🧪', task: '☐', decision: '❓', project: '📘' };
const KIND_NAME = { root: 'Project', module: 'Module', group: 'Docs', feature: 'Feature', task: 'Task', decision: 'Decision', project: 'Project note' };
const LAYER = {}; // id -> { label, color }
const EDGE_NAME = { related: 'related', wikilink: 'mentions', depends: 'depends on', decision: 'decision affects', affects: 'affects', blocks: 'blocks', flow: 'flow', shares: 'shares' };
const DIRECTED = new Set(['depends', 'decision', 'affects', 'blocks', 'flow']);
const ROW = 34, COLGAP = 56, PAD = 10, LEVEL = 88, XGAP = 14, H = 14, STACK = 22;

const S = { data: null, inst: [], instById: new Map(), byIid: new Map(), view: 'map', collapsed: new Set(), filters: { status: new Set(), module: '', kind: '', layer: '', q: '' },
  selected: null, hover: null, edgeKinds: new Set(['related', 'depends', 'decision', 'wikilink', 'affects', 'blocks', 'flow', 'shares']), tx: 40, ty: 40, k: 1, laidOut: new Map(), ready: false, orient: 'vertical', offsets: { vertical: {}, horizontal: {} }, focus: null };

const store = { get(k, d) { try { const v = localStorage.getItem('spt.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('spt.' + k, JSON.stringify(v)); } catch {} } };

// ------------------------------------------------------------ data
async function load() {
  const res = await fetch('tree.json', { cache: 'no-store' });
  S.data = await res.json();
  for (const l of S.data.layers || []) { LAYER[l.id] = { label: l.label, color: l.color }; for (const k of l.kinds) { KIND_NAME[k.id] = k.label; if (!GLYPH[k.id]) GLYPH[k.id] = '📄'; } }
  for (const a of ['business', 'frontend', 'backend', 'qa', 'shared']) if (!LAYER[a]) LAYER[a] = { label: a, color: null };
  const theme = store.get('theme', null); if (theme) document.documentElement.dataset.theme = theme;
  const collapsed = store.get('collapsed', null);
  if (collapsed) S.collapsed = new Set(collapsed);
  else for (const n of Object.values(S.data.nodes)) if (n.kind === 'feature' || n.kind === 'group' || (n.kind === 'task' && n.children.length) || (n.kind === 'module' && (S.orient === 'vertical' || n.module !== 'identity'))) S.collapsed.add(n.id);
  S.orient = store.get('orient', 'vertical');
  const saved = store.get('offsets', null);
  if (saved && typeof saved === 'object') S.offsets = { vertical: saved.vertical || {}, horizontal: saved.horizontal || {} };
  const view = store.get('view', window.innerWidth < 720 ? 'outline' : 'map');
  setView(view, false);
  buildFilters();
  S.ready = true;
